<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" type="image/png" href="logo.png" />
    <title>早安 台灣｜Good Morning Taiwan</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: "Noto Sans TC", system-ui, sans-serif;
        background: #f6fbf9;
        color: #173b3a;
      }
      .shell {
        min-height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      .topbar {
        min-height: 68px;
        padding: 12px clamp(18px, 4vw, 52px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        background: #fff;
        border-bottom: 1px solid #dcece6;
        box-shadow: 0 4px 20px rgba(20, 87, 80, 0.06);
        position: relative;
        z-index: 2;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-weight: 900;
      }
      .brand-mark {
        width: 44px;
        height: 44px;
        display: block;
        flex: none;
        object-fit: contain;
      }
      .brand small {
        display: block;
        color: #5c7e7b;
        font-size: 0.7rem;
        letter-spacing: 0.06em;
      }
      nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .nav-link {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        color: #176b65;
        background: #e7f6f1;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 800;
        cursor: pointer;
      }
      .nav-link[aria-current="page"] {
        color: #fff;
        background: #168a7c;
      }
      .page-frame {
        width: 100%;
        height: 100%;
        min-height: calc(100vh - 68px);
        border: 0;
        display: block;
      }
      @media (max-width: 700px) {
        .topbar {
          align-items: flex-start;
        }
        .brand small {
          display: none;
        }
        .nav-link {
          padding: 8px 11px;
          font-size: 0.76rem;
        }
        .page-frame {
          min-height: calc(100vh - 68px);
        }
      }

      .menu-toggle,
      .menu-close,
      .menu-heading {
        display: none;
      }
      .menu-toggle {
        width: 46px;
        height: 46px;
        padding: 11px;
        border: 0;
        border-radius: 14px;
        background: #e7f6f1;
        cursor: pointer;
      }
      .menu-toggle span {
        width: 100%;
        height: 3px;
        display: block;
        border-radius: 999px;
        background: #176b65;
      }
      .menu-toggle span + span {
        margin-top: 5px;
      }
      @media (max-width: 700px) {
        .topbar {
          align-items: center;
        }
        .menu-toggle {
          display: block;
          flex: none;
        }
        #page-navigation {
          position: fixed;
          inset: 0;
          z-index: 1000;
          padding: 24px;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          justify-content: center;
          gap: 14px;
          overflow-y: auto;
          background: rgba(231, 246, 241, 0.46);
          -webkit-backdrop-filter: blur(18px) saturate(120%);
          backdrop-filter: blur(18px) saturate(120%);
          visibility: hidden;
          opacity: 0;
          transform: translateY(-12px);
          pointer-events: none;
          transition:
            opacity 180ms ease,
            transform 180ms ease,
            visibility 180ms;
        }
        #page-navigation::before {
          content: "";
          position: absolute;
          inset: 0;
          z-index: -1;
          pointer-events: none;
          opacity: 0.11;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.55'/%3E%3C/svg%3E");
          mix-blend-mode: soft-light;
        }
        body.menu-open {
          overflow: hidden;
        }
        body.menu-open #page-navigation {
          visibility: visible;
          opacity: 1;
          transform: translateY(0);
          pointer-events: auto;
        }
        .menu-heading {
          width: min(100%, 560px);
          margin: 0 auto 22px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 20px;
        }
        .menu-heading span {
          display: block;
          font-size: clamp(2rem, 10vw, 3.5rem);
          font-weight: 900;
          line-height: 1.1;
        }
        .menu-heading small {
          color: #5c7e7b;
          font-weight: 800;
          letter-spacing: 0.12em;
        }
        .menu-close {
          width: 48px;
          height: 48px;
          display: grid;
          place-items: center;
          flex: none;
          border: 1px solid #b8ded5;
          border-radius: 50%;
          color: #176b65;
          background: #fff;
          font:
            400 2rem/1 system-ui,
            sans-serif;
          cursor: pointer;
        }
        #page-navigation .nav-link {
          width: min(100%, 560px);
          margin: 0 auto;
          padding: 18px 22px;
          border-radius: 18px;
          font-size: clamp(1.05rem, 5vw, 1.35rem);
          text-align: left;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #page-navigation {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="logo.png" alt="早安 台灣 Logo" /><span
            >早安 台灣<small>GOOD MORNING TAIWAN</small></span
          >
        </div>
        <button
          class="menu-toggle"
          type="button"
          aria-label="開啟頁面選單"
          aria-controls="page-navigation"
          aria-expanded="false"
        >
          <span></span><span></span><span></span>
        </button>
        <nav id="page-navigation" aria-label="主要導覽" aria-hidden="true">
          <div class="menu-heading">
            <div><span>選擇頁面</span><small>CHOOSE A PAGE</small></div>
            <button class="menu-close" type="button" aria-label="關閉頁面選單">
              ×
            </button>
          </div>
          <button
            class="nav-link"
            data-page="Daily_Shopping/index.html"
            data-title="日常採買 Daily Shopping"
            aria-current="page"
          >
            日常採買 Shopping</button
          ><button
            class="nav-link"
            data-page="City_Exploration/index.html"
            data-title="城市探索 City Exploration"
          >
            城市探索 Explore</button
          ><button
            class="nav-link"
            data-page="Public_Transport/index.html"
            data-title="公共運輸 Public Transport"
          >
            公共運輸 Transit
          </button>
        </nav>
      </header>
      <main>
        <iframe
          id="page-frame"
          class="page-frame"
          src="Daily_Shopping/index.html"
          title="日常採買 Daily Shopping"
        ></iframe>
      </main>
    </div>
    <script src="main.js"></script>
  </body>
</html>
